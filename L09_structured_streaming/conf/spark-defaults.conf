# L09 - Spark defaults for a small laptop (single JVM, local mode)
spark.master                        local[2]
spark.driver.memory                 1g
spark.sql.shuffle.partitions        4
spark.sql.session.timeZone          UTC
spark.jars.packages                 org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
spark.jars.ivy                      /root/.ivy2
spark.ui.showConsoleProgress        false
# Structured Streaming: keep fewer old batches in the checkpoint (default 100)
spark.sql.streaming.minBatchesToRetain  20
