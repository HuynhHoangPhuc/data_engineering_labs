# L12 - dbt on Postgres: the Olist OLTP database doubles as our small "warehouse".
# dbt itself runs on your laptop (Python venv) and connects to localhost:5432.
# Memory: ~150 MB.

services:
  postgres:
    image: postgres:18.6
    container_name: l12-postgres
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports: ["5432:5432"]
    volumes:
      - ../datasets/olist/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d olist"]
      interval: 5s
      retries: 20
    mem_limit: 512m

volumes:
  pgdata:
