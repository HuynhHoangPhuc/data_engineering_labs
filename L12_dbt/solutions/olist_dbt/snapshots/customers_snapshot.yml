# Stretch: type-2 slowly changing dimension for customers (dbt snapshot, timestamp strategy)
#   dbt snapshot   -> creates snapshots.customers_snapshot with dbt_valid_from / dbt_valid_to
snapshots:
  - name: customers_snapshot
    relation: source('olist', 'customers')
    config:
      unique_key: customer_id
      strategy: timestamp
      updated_at: updated_at
