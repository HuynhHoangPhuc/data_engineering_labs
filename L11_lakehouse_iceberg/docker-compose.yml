# L11 - Lakehouse: Apache Iceberg tables on an S3-compatible object store, written by Spark, read by Trino.
#
#   seaweedfs     S3 API :8333 (+ filer UI :8888)      ~150-400 MB  (MinIO replacement, see README "Why SeaweedFS?")
#   iceberg-rest  Iceberg REST catalog :8181           ~250 MB   (apache/iceberg-rest-fixture, SQLite-backed)
#   spark         Spark 4.1.3 + Iceberg 1.11 (idle; use spark-sql / spark-submit via exec)  ~1.3 GB when running
#   trino         Trino 483, single node :8080         ~1.3 GB   (profile "trino" -> start it when you need it)
# Total with everything running ~3 GB. On a 4 GB Docker VM run Spark jobs and Trino queries one at a time.

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: lakeadmin
  AWS_SECRET_ACCESS_KEY: lakepassword
  AWS_REGION: us-east-1

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    container_name: l11-seaweedfs
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=256 -volume.max=50
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer web UI (browse buckets/warehouse)
      - "9333:9333"   # master UI
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null && wget -qO- http://localhost:8888/ >/dev/null"]
      interval: 5s
      retries: 30
    mem_limit: 768m

  # one-shot: create the "warehouse" bucket
  create-bucket:
    image: chrislusf/seaweedfs:4.44
    container_name: l11-create-bucket
    depends_on:
      seaweedfs: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 3
        echo "s3.bucket.create -name warehouse" | weed shell -master=seaweedfs:9333
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: l11-iceberg-rest
    depends_on:
      create-bucket: {condition: service_completed_successfully}
    ports: ["8181:8181"]
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # persist the catalog (table name -> current metadata.json) in a file instead of in-memory SQLite
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    user: "0"
    volumes:
      - catalog-data:/catalog
    mem_limit: 512m

  spark:
    image: spark:4.1.3-python3
    container_name: l11-spark
    user: "0"
    command: ["tail", "-f", "/dev/null"]
    # spark-sql creates an embedded Derby metastore (metastore_db/, derby.log) in the working dir -> keep it out of the repo
    working_dir: /tmp
    depends_on: [iceberg-rest]
    environment:
      <<: *s3-env
      SPARK_SUBMIT_OPTS: "-Divy.home=/root/.ivy2"
    ports: ["4040:4040"]
    volumes:
      - ./:/opt/lab
      - ../datasets/data/taxi:/data/taxi:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy-cache:/root/.ivy2
    mem_limit: 2g

  trino:
    image: trinodb/trino:483
    container_name: l11-trino
    profiles: ["trino"]
    depends_on: [iceberg-rest]
    ports: ["8080:8080"]
    volumes:
      - ./trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
    mem_limit: 1600m

volumes:
  seaweed-data:
  catalog-data:
  ivy-cache:
