# Mounted at /opt/spark/conf/spark-defaults.conf (L06). Sized for an 8 GB laptop.
spark.master                     local[4]
spark.driver.memory              2g
# 200 shuffle partitions (the default) is far too many for ~3 M rows on one machine
spark.sql.shuffle.partitions     8
spark.sql.session.timeZone       UTC
spark.ui.port                    4040
spark.ui.showConsoleProgress     false
# keep event logs so finished apps can be inspected with the history server (stretch)
spark.eventLog.enabled           true
spark.eventLog.dir               file:///tmp/spark-events
