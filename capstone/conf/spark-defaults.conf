# Capstone Spark Connect server: Spark 4.1.3 + Iceberg 1.11 + Kafka source
spark.master                            local[2]
spark.driver.memory                     1200m
spark.sql.shuffle.partitions            8
spark.sql.session.timeZone              UTC
spark.ui.showConsoleProgress            false
spark.jars.ivy                          /root/.ivy2
spark.jars.packages                     org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
spark.connect.grpc.binding.port         15002

spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type             rest
spark.sql.catalog.lake.uri              http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse        s3://warehouse/
spark.sql.catalog.lake.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint      http://seaweedfs:8333
spark.sql.catalog.lake.s3.path-style-access  true
spark.sql.catalog.lake.s3.access-key-id      lakeadmin
spark.sql.catalog.lake.s3.secret-access-key  lakepassword
spark.sql.catalog.lake.client.region    us-east-1
spark.sql.defaultCatalog                lake
