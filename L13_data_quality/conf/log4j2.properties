# Quieter Spark console: WARN and above only (the default INFO output hides your results).
# Mounted at /opt/spark/conf/log4j2.properties. Set rootLogger.level = info to see everything.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
# noisy but harmless on a laptop
logger.nativeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeloader.level = error
# OpenLineage prints a long (harmless here) class-loader warning for every event
logger.olwrapper.name = io.openlineage.spark.agent.lifecycle.SparkOpenLineageExtensionVisitorWrapper
logger.olwrapper.level = error
# ...and an ERROR "Query execution is null: can't emit event for executionId N" for RDD-only Spark jobs (no lineage to emit)
logger.olcontext.name = io.openlineage.spark.agent.lifecycle.ContextFactory
logger.olcontext.level = fatal
