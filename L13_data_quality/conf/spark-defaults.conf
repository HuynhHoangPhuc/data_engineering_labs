# L13 Part 3 - Spark defaults (mounted at /opt/spark/conf/spark-defaults.conf). Sized for an 8 GB laptop.
spark.master                     local[2]
spark.driver.memory              1g
spark.sql.shuffle.partitions     4
spark.sql.session.timeZone       UTC
spark.ui.showConsoleProgress     false
spark.jars.ivy                   /root/.ivy2

# ---- OpenLineage: a SparkListener that turns every job into OpenLineage START/COMPLETE events -----
# The jar is downloaded from Maven Central on first use (cached in the ivy-cache volume).
spark.jars.packages              io.openlineage:openlineage-spark_2.13:1.53.0
spark.extraListeners             io.openlineage.spark.agent.OpenLineageSparkListener
# "namespace" of the JOBS (datasets get their namespace from their location, e.g. file)
spark.openlineage.namespace      l13
# Where events go. The README passes the transport on the command line:
#   Marquez:  --conf spark.openlineage.transport.type=http --conf spark.openlineage.transport.url=http://marquez-api:5000
#   Fallback: --conf spark.openlineage.transport.type=file --conf spark.openlineage.transport.location=/lab/output/openlineage/events.jsonl
spark.openlineage.transport.type http
spark.openlineage.transport.url  http://marquez-api:5000
